<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <!-- Background for visibility -->
  <rect width="500" height="500" fill="#f0f0f0" />
  
  <text x="20" y="40" font-family="Arial" font-size="20" fill="#333">FACTORY SPEC SHEET (DUMMY TEST)</text>

  <!-- These IDs MUST match your ZONES keys exactly -->
  <!-- Zone 1: Inner Thumb -->
  <circle id="zone1" cx="100" cy="150" r="50" fill="#cccccc" />
  <text x="60" y="220" font-size="12" fill="#666">Inner Thumb (zone1)</text>

  <!-- Zone 7: Web -->
  <rect id="zone7" x="200" y="100" width="100" height="100" fill="#cccccc" />
  <text x="220" y="220" font-size="12" fill="#666">Web (zone7)</text>

  <!-- Zone 11: Outer Thumb -->
  <path id="zone11" d="M400 100 L450 200 L350 200 Z" fill="#cccccc" />
  <text x="360" y="220" font-size="12" fill="#666">Outer Thumb (zone11)</text>

  <!-- Personalization Slots -->
  <text id="thumbName" x="100" y="350" font-size="30" fill="#000">THUMB_TEXT</text>
  <text id="pinkyName" x="100" y="400" font-size="30" fill="#000">PINKY_TEXT</text>
</svg>
