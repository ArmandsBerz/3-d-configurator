<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>BabylonJS Project</title>
    <style>
      /* Make the canvas fill the entire window */
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
    </style>
  </head>
  <body>
    <canvas id="renderCanvas"></canvas>
    <!-- Load the JavaScript file as a module -->
    <script type="module" src="/src/index.js"></script>
  </body>
</html>
